name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, bin: exterior, helper: run-mac.command }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, bin: exterior, helper: run-mac.command }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, bin: exterior.exe, helper: run-windows.bat }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: cargo build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -e
          d=exterior-${{ matrix.name }}
          mkdir -p "$d"
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.helper }} README.md "$d/"
          cp -R templates "$d/"
          if [ "${{ runner.os }}" = Windows ]; then 7z a -tzip "$d.zip" "$d" >/dev/null; else chmod +x "$d/${{ matrix.bin }}" "$d/${{ matrix.helper }}"; zip -qr "$d.zip" "$d"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: exterior-${{ matrix.name }}
          path: exterior-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

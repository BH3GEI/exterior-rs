[package]
name = "exterior"
version = "0.9.12"
edition = "2021"

[dependencies]
serde_json = "1"
tiny_http = "0.12"
chacha20poly1305 = "0.10"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
strip = true
opt-level = "s"
